[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visor-dev"
version = "0.1.0"
description = "Open source, cross-platform Quest developer toolkit — ADB wrapper, MCP server, and CLI, an alternative to Meta Quest Developer Hub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Chisomo Banzi" }]
keywords = ["quest", "meta-quest", "adb", "vr", "mcp", "android", "oculus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6",
]
# Native desktop-app window (visor app). On Linux the GTK/WebKit backend uses
# the system PyGObject + WebKit2GTK; no extra system libs needed on most desktops.
app = [
    "pywebview>=5.0",
]

[project.scripts]
visor = "visor.cli.main:app"
visor-mcp = "visor.mcp.server:main"

[project.urls]
Homepage = "https://github.com/chisomobanzi/visor"
Repository = "https://github.com/chisomobanzi/visor"
Issues = "https://github.com/chisomobanzi/visor/issues"

[tool.hatch.build.targets.wheel]
packages = ["visor"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E4/E7/E9); pinned so a ruff upgrade
# doesn't silently add rules and break CI.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visor"
version = "0.1.0"
description = "Open source Quest developer toolkit for Linux — ADB wrapper, MCP server, and CLI replacing Meta Quest Developer Hub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Chisomo Banzi" }]
keywords = ["quest", "meta-quest", "adb", "vr", "mcp", "android", "oculus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
visor = "visor.cli.main:app"
visor-mcp = "visor.mcp.server:main"

[project.urls]
Homepage = "https://github.com/chisomo-banzi/visor"

[tool.hatch.build.targets.wheel]
packages = ["visor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
